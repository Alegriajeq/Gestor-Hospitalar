{% extends 'home.html' %}

{% block title %}Novo Médico{% endblock %}

{% block conteudo %}
<div class="container mt-5">
    <h2 class="mb-4 text-primary">{{ titulo }}</h2>

    <form method="post" class="card p-4 shadow-sm border-0">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_nome" class="form-label text-brown">Nome:</label>
            {{ form.nome }}
        </div>
        <div class="mb-3">
            <label for="id_especialidade" class="form-label text-brown">Especialidade:</label>
            {{ form.especialidade }}
        </div>
        <div class="mb-3">
            <label for="id_telefone" class="form-label text-brown">Telefone:</label>
            {{ form.telefone }}
        </div>
        <div class="mb-3">
            <label for="id_email" class="form-label text-brown">Email:</label>
            {{ form.email }}
        </div>

        <div class="d-flex justify-content-between mt-3">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{% url 'lista_medicos' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
